name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Throwaway values for the test server only; production secrets never live in CI.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (no database, no secrets, as on a build server)
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ""
          APP_ENCRYPTION_KEY: ""
          DATA_DIR: /tmp/empty-data

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Lighthouse
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
